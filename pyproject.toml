[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "izn"
version = "0.1.0"
description = "Distributed Big-Data Pipeline and Multialgorithm Prediction for Iron-Zinc Risk Nutrigenomics"
authors = [{name = "Kahunde Elizabeth", email = "kahundeliz7@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "scikit-allel>=1.3",
    "shap>=0.44",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pytest>=7.4",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]