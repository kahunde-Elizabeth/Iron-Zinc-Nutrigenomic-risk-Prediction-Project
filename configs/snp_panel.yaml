# Iron-zinc SNP panel (GRCh37 / 1000 Genomes Phase 3).
# chrom + pos_grch37 are VERIFIED against Ensembl GRCh37 (scripts/01_verify_panel.py, 2026-11-03).
# ref/alt are filled automatically from the 1000 Genomes records by scripts/02_extract_panel.py (see panel_qc.tsv).
# risk_allele: letter in the 1000 Genomes REF/ALT alphabet, assigned ONLY where the cited human evidence supports a low-iron/low-zinc direction.
# null = unresolved or not a deficiency-risk allele (see evidence_status + note). weight is null until the score design is decided.
# evidence_status: nominal_human | conflicting | not_deficiency_direction | functional_cell_only | no_human_zinc_effect | unresolved
# Evidence extracted 2026-11-03 (risk_alleles_evidence_checked.csv); numbers NOT yet re-checked against the papers.
# african_replicated is "unknown" until you cite a paper that replicated the effect in an African cohort.
# extract: false = chromosome not in the object store yet (ingest it first, then set true).

panel:
  # ---- iron ----
  - {rsid: rs855791,   gene: TMPRSS6, chrom: "22", pos_grch37: 37462936,  trait: iron, risk_allele: G, weight: null, african_replicated: unknown, extract: true, evidence_status: nominal_human, evidence_note: "A raises TSAT in African children (+0.155 SD, P=0.0147, EAF 0.077), so G is the lower-iron allele; agrees with Hamed 2024 (GG lower ferritin/body iron). Other biomarkers same direction but P>0.05. Source: Muriuki 2025 medRxiv preprint (African children, hg19, betas in SD of inverse-normal transformed biomarker). Disagrees with one earlier reading (Tanaka), probably strand labelling."}
  - {rsid: rs4820268,  gene: TMPRSS6, chrom: "22", pos_grch37: 37469591,  trait: iron, risk_allele: G, weight: null, african_replicated: unknown, extract: true, evidence_status: nominal_human, evidence_note: "G lowers Hb (-0.28 g/dL Kenyan children; -0.18 meta); did not survive FDR; Gambian null"}
  - {rsid: rs3811647,  gene: TF,      chrom: "3",  pos_grch37: 133484029, trait: iron, risk_allele: A, weight: null, african_replicated: true, extract: true, evidence_status: african_gwas_transferrin, evidence_note: "A raises transferrin: +0.22 SD, P=3.45e-16 (African meta-analysis, EAF 0.22); AA lower TSAT in Gambians (Jallow 2021). Source: Muriuki 2025 medRxiv preprint (African children, hg19, betas in SD of inverse-normal transformed biomarker). Transferrin is a proxy for lower iron status: the preprint did not test iron deficiency for TF SNPs."}
  - {rsid: rs1799852,  gene: TF,      chrom: "3",  pos_grch37: 133475722, trait: iron, risk_allele: C, weight: null, african_replicated: true, extract: true, evidence_status: african_gwas_transferrin, evidence_note: "T LOWERS transferrin: -0.36 SD, P=1.16e-10 (African meta-analysis, EAF 0.06), so the transferrin-raising allele C is used as the low-iron direction. Earlier studies were mixed (Gichohi-Wainaina; Jallow null). Source: Muriuki 2025 medRxiv preprint (African children, hg19, betas in SD of inverse-normal transformed biomarker)."}
  - {rsid: rs1800629,  gene: TNF,     chrom: "6",  pos_grch37: 31543031,  trait: iron_inflammation, risk_allele: A, weight: null, african_replicated: unknown, extract: true, evidence_status: nominal_human, evidence_note: "A -> lower ferritin, African American cohort, nominal; ferritin is an acute-phase marker"}
  - {rsid: rs1800562,  gene: HFE,     chrom: "6",  pos_grch37: 26093141,  trait: iron, risk_allele: null, weight: null, african_replicated: unknown, extract: true, note: "C282Y; mainly European, check African frequency", evidence_status: not_deficiency_direction, evidence_note: "C282Y lowers transferrin / iron-loading; not a low-iron allele"}
  - {rsid: rs1799945,  gene: HFE,     chrom: "6",  pos_grch37: 26091179,  trait: iron, risk_allele: null, weight: null, african_replicated: unknown, extract: true, note: "H63D", evidence_status: not_deficiency_direction, evidence_note: "H63D lowers transferrin / iron-loading; not a low-iron allele"}
  - {rsid: rs11568350, gene: SLC40A1, chrom: "2",  pos_grch37: 190430096, trait: iron, risk_allele: null, weight: null, african_replicated: unknown, extract: true, evidence_status: unresolved, evidence_note: "Q248H -> higher ferritin in Botswana males; letter-to-Q248H mapping unverified"}
  - {rsid: rs4854748, gene: TF, chrom: "3", pos_grch37: 133446881, trait: iron, risk_allele: C, weight: null, african_replicated: true, extract: true, evidence_status: african_gwas_transferrin, evidence_note: "Independent TF signal (r2=0.03 with rs6762719). T LOWERS transferrin: -0.24 SD, P=1.12e-16 (EAF 0.20), so C is the transferrin-raising allele. Source: Muriuki 2025 medRxiv preprint (African children, hg19, betas in SD of inverse-normal transformed biomarker). Position/alleles from the paper: verify with Ensembl."}
  - {rsid: rs2905094, gene: GTF3C5, chrom: "9", pos_grch37: 135902689, trait: iron, risk_allele: C, weight: null, african_replicated: true, extract: true, evidence_status: african_gwas_iron_deficiency, evidence_note: "East Africa (Kenya+Uganda) only. T raises ferritin, TSAT and serum iron, lowers transferrin (-0.23 SD, P=8.08e-9) and lowers iron deficiency (OR 0.81, 95% CI 0.68-0.97, P=0.02), so C is the lower-iron allele. EAF 0.16. Source: Muriuki 2025 medRxiv preprint (African children, hg19, betas in SD of inverse-normal transformed biomarker). Needs chr9 in the store."}
  - {rsid: rs73596248, gene: "CHCHD7/SDR16C5", chrom: "8", pos_grch37: 57134187, trait: iron, risk_allele: null, weight: null, african_replicated: true, extract: true, evidence_status: ambiguous_direction, evidence_note: "A raises hepcidin (+0.27 SD, P=4.51e-8, EAF 0.06) yet is protective for iron deficiency (OR 0.79, 0.64-0.97, P=0.03) and not associated with individual iron biomarkers: directions disagree, so no risk allele assigned. Feature only. Source: Muriuki 2025 medRxiv preprint (African children, hg19, betas in SD of inverse-normal transformed biomarker)."}
